<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Giyim Sitesi Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f5; color: #333; }
    .container { max-width: 1100px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; }
    .header { text-align: center; padding: 20px; border-bottom: 1px solid #e0e0e0; background: #fff; }
    .logo { font-size: 32px; font-weight: bold; color: #000; margin-bottom: 5px; }
    .subtitle { font-size: 12px; color: #666; }
    .content-row { display: flex; gap: 24px; padding: 20px; justify-content: center; }
    .chat-column { flex: 1 1 100%; max-width: 700px; display: flex; flex-direction: column; }
    .chat-area { padding: 0 0 20px 0; min-height: calc(100vh - 260px); max-height: calc(100vh - 260px); overflow-y: auto; }
    .greeting { text-align: center; font-size: 18px; font-weight: bold; margin: 20px 0; }
    .description { text-align: center; line-height: 1.6; margin-bottom: 20px; color: #666; padding: 0 20px; }
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 20px 24px 20px; }
    .action-btn { background: #f0f0f0; border: none; border-radius: 12px; padding: 14px; text-align: left; cursor: pointer; transition: background-color 0.15s; font-size: 14px; color: #333; }
    .action-btn:hover { background: #e8e8e8; }
    .action-btn::after { content: "↗"; float: right; color: #ff6b35; font-weight: bold; }
    .user-message, .bot-message { margin: 10px 20px; padding: 12px 16px; border-radius: 18px; max-width: 80%; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .user-message { background: #007AFF; color: white; margin-left: auto; text-align: right; }
    .bot-message { background: #f0f0f0; color: #333; margin-right: auto; }
    .response { margin: 12px 20px; padding: 1em; background: #fafafa; border-radius: 8px; border: 1px solid #eee; }
    .response h3 { margin: 0 0 8px 0; font-size: 16px; color: #333; }
    .input-container { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; border-top: 1px solid #e0e0e0; padding: 12px 16px; z-index: 999; box-shadow: 0 -4px 20px rgba(0,0,0,0.03); border-radius: 12px 12px 0 0; }
    .input-wrapper { background: #f8f8f8; border-radius: 25px; padding: 6px; display: flex; align-items: center; }
    .ai-label { background: #333; color: white; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; margin-right: 10px; }
    .message-input { flex: 1; border: none; background: transparent; padding: 10px; font-size: 16px; outline: none; }
    .message-input::placeholder { color: #999; }
    .send-btn { background: none; border: none; color: #666; font-size: 20px; cursor: pointer; padding: 8px 12px; }
    @media (max-width: 900px) { .content-row { flex-direction: column; gap: 0; padding: 12px; } .input-container { max-width: 100%; } }
    @media (max-width: 480px) { .quick-actions { grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px; } .action-btn { padding: 12px; font-size: 13px; } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">Gevheri Store</div>
    <div class="subtitle">pre-loved luxury &nbsp;&nbsp;&nbsp;&nbsp; Seconds</div>
  </div>

  <div class="content-row">
    <div class="chat-column">
      <div class="chat-area" id="chat-area">
        <div class="greeting">MERHABALAR,</div>
        <div class="description">
          Ben Gevheri Store yapay zeka asistanınız, seçimlerinizle ya da bana sorular sorarak mağazamızın size en uygun ürünlerini önermek için 7/24 sizinleyim.
        </div>

        <div class="quick-actions" id="quick-actions">
          <button type="button" class="action-btn">Yazlık Ayakkabı Arıyorum</button>
          <button type="button" class="action-btn">Yazlık Aksesuar Arıyorum</button>
          <button type="button" class="action-btn">Parti İçin Ayakkabı Öner</button>
          <button type="button" class="action-btn">Toplantı İçin Elbise Öner</button>
        </div>

        {% if response %}
          <div class="response">
            <div>{{ response.llm|safe }}</div>
          </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>

<form method="POST" id="chat-form">
  <div class="input-container">
    <div class="input-wrapper">
      <div class="ai-label">AI</div>
      <input type="text" name="user_input" id="user_input" class="message-input" placeholder="Mesajınız" autocomplete="off">
      <button type="submit" class="send-btn" id="send-btn">▶</button>
    </div>
  </div>
</form>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const chatForm = document.getElementById('chat-form');
    const input = document.getElementById('user_input');
    const chatArea = document.getElementById('chat-area');
    const quickActions = document.getElementById('quick-actions');

    function addMessage(text, sender) {
      const messageDiv = document.createElement('div');
      messageDiv.className = sender === 'user' ? 'user-message' : 'bot-message';
      messageDiv.textContent = text;
      if (quickActions && quickActions.style.display !== 'none') {
        chatArea.insertBefore(messageDiv, quickActions);
      } else {
        chatArea.appendChild(messageDiv);
      }
      setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
    }

    chatForm.addEventListener('submit', function (e) {
      if (!input.value.trim()) { e.preventDefault(); return; }
      addMessage(input.value.trim(), 'user');
      if (quickActions) quickActions.style.display = 'none';
    });

    document.querySelectorAll('.action-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        if (!input) return;
        input.value = this.textContent.trim();
        if (quickActions) quickActions.style.display = 'none';
        addMessage(input.value, 'user');
        chatForm.submit();
      });
    });
  });
</script>
</body>
</html>
